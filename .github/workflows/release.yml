name: Release

# Push a tag like v0.2.0 to build the package, attach it and portable builds to a
# GitHub release, and publish it to PyPI. Running it manually (workflow_dispatch)
# only builds the portable bundles as downloadable artifacts.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3

      - name: Check tag matches package version
        run: |
          version=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match pyproject version $version" >&2
            exit 1
          fi

      - name: Test
        run: |
          uv sync --locked
          uv run --locked python -m unittest discover -s tests

      - name: Build
        run: uv build

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  pypi:
    needs: release
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/memtaskman/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        # Trusted publishing (OIDC): no API token. Pinned to the v1.14.3 commit.
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/

  portable:
    # PyInstaller can't cross-compile: build on each target. Ubuntu 22.04 keeps glibc at 2.35
    # so the Linux bundles run on older distributions too.
    needs: release
    if: always() && (needs.release.result == 'success' || needs.release.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: windows-11-arm
          - os: ubuntu-22.04
          - os: ubuntu-22.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.13"
      - name: Build, smoke-test and package
        env:
          PYTHONUTF8: "1"
        run: |
          uv sync --locked
          uv run --locked --with pyinstaller python tools/build_portable.py
      - uses: actions/upload-artifact@v7
        with:
          name: portable-${{ matrix.os }}
          path: dist/portable/
      - name: Attach to the GitHub release
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/portable/*
