[project]
name = "memtaskman"
version = "0.2.0"
description = "An htop for what's inside your RAM, not just how full it is."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "textual>=1.0",
    "psutil>=5.9",
]
authors = [
    { name = "Yogpod", email = "yogpod332@gmail.com" },
]
classifiers = [
    "Environment :: Console",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Topic :: System :: Monitoring",
]

[project.scripts]
memtaskman = "memtaskman.cli:main"
mtm = "memtaskman.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/memtaskman"]
